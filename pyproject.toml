[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffxiv-prism"
version = "0.1.0"
description = "Local FFXIV glamour appearance dataset builder."
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "cloudscraper>=1.2.71",
    "httpx>=0.28",
    "numpy>=2.0",
    "pillow>=10.4",
    "selenium>=4.20",
    "torch>=2.4",
    "transformers>=4.45,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffxiv-prism"
version = "0.1.0"
description = "Local FFXIV glamour appearance dataset builder."
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "selenium>=4.20",
]

[tool.setuptools.packages.find]
where = ["src"]
